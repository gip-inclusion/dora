version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    open-pull-requests-limit: 20

  - package-ecosystem: "pip"
    directory: "/back"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build"
      prefix-development: "build(dev)"
    open-pull-requests-limit: 20
    allow:
      - dependency-type: all
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "npm"
    directory: "/front"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build"
      prefix-development: "build(dev)"
    open-pull-requests-limit: 20
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  - package-ecosystem: "pip"
    directory: "/analytics"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    commit-message:
      prefix: "build"
    open-pull-requests-limit: 10
    groups:
      # sqlfluff-templater-dbt dépend de dbt-core et de sqlfluff : tout monte ensemble
      dbt-sqlfluff:
        patterns:
          - "dbt-*"
          - "sqlfluff*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
        # ruff est en 0.x : une mineure change règles et formatage, PR à part
        exclude-patterns:
          - "ruff"
