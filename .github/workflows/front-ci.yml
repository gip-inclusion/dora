name: Dora Front CI

permissions:
  contents: read

on:
  push:
    paths:
      - 'front/**'
      - '.github/workflows/front-ci.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.13]

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        working-directory: front
        run: npm install

      - name: Check formatting
        working-directory: front
        run: npm run format:check

      - name: Lint code
        working-directory: front
        run: npm run lint

      - name: Run tests
        working-directory: front
        run: npm run test

      - name: Build
        working-directory: front
        # `MAX_REQUESTS_PER_MINUTE` est importée depuis `$env/static/private` :
        # sans elle, le build échoue (export manquant)
        env:
          MAX_REQUESTS_PER_MINUTE: 24
        run: npm run build
