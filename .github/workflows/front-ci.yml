name: Dora Front CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  front-ci:
    runs-on: ubuntu-latest

    # Un groupe par commit sur `main`, pour que chaque commit fusionné soit vérifié
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
      cancel-in-progress: true

    # Les variables validées par `front/src/env.ts` doivent être présentes,
    # sinon SvelteKit refuse de démarrer (lint, tests et build chargent la config Vite).
    env:
      VITE_PUBLIC_CANONICAL_URL: "http://localhost:3000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: front/package.json

      - name: Install dependencies
        working-directory: front
        run: npm install

      - name: Check formatting
        working-directory: front
        run: npm run format:check

      - name: Lint code
        working-directory: front
        run: npm run lint

      - name: Run tests
        working-directory: front
        run: npm run test

      - name: Build
        working-directory: front
        # `MAX_REQUESTS_PER_MINUTE` est importée depuis `$env/static/private` :
        # sans elle, le build échoue (export manquant)
        env:
          MAX_REQUESTS_PER_MINUTE: 24
        run: npm run build
